# ======================================================================
# ONE hourly orchestrator — replaces auto-pipeline, publish,
# news-refresh, stats-pipeline, stats-traffic, stats-health,
# title-seed and episode-guides (see pipeline-consolidation/DESIGN.md).
# The old workflows keep workflow_dispatch for the 1-week soak but
# their schedules are commented out; rollback = re-enable them.
# The Flickposts fetch-hourly workflow stays separate (cross-repo, no PAT).
# Schedule :35 UTC. One commit/hour max. State gate in
# out/orchestrator-state.json catches up gated steps dropped by GitHub.
# ======================================================================
name: Hourly pipeline

on:
  schedule:
    # :35 UTC — the old news-refresh slot; the fetch must run first and
    # the whole job must finish inside the hour.
    - cron: '35 * * * *'
  workflow_dispatch:
    inputs:
      episode_rewrite:
        description: 'Re-summarise episodes via fileData: "Drama|Ep,Drama|Ep" (clears their summaries so the episode step rewrites them)'
        required: false
        default: ''

concurrency:
  group: flickatlas-site-writes
  cancel-in-progress: false

jobs:
  hourly:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # actions: write — the last step dispatches the AI watchdog workflow
      # (POST /actions/workflows/watchdog.yml/dispatches). Same repo only.
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Offline regression checks
        run: |
          node scripts/test_listing_order.js
          python3 scripts/test_gemini_boxoffice.py
          python3 scripts/test_boxoffice_integrity.py
          python3 scripts/test_tmdb_refresh.py
          python3 scripts/test_ott_refresh.py
          python3 scripts/test_ott_backfill.py

      # Source clocks, success-only catch-up and bounded retries live in one
      # tested helper. Missing state remains clock-only (no bootstrap burst).
      - name: Decide gated steps
        id: decide
        run: python3 scripts/pipeline_schedule.py decide

      # --- 1. fetch (always): the queue gemini_batch reads ------------
      - name: Fetch news queue
        id: fetch
        continue-on-error: true
        env:
          PANEL_IMPORT_TOKEN: ${{ secrets.PANEL_IMPORT_TOKEN }}
        run: |
          python3 scripts/fetch.py --registry scripts/registry.json --out out
          curl -sS -X POST "https://flickatlas-admin.hidden-decodes.workers.dev/api/assistant/publish-export" \
            -H "Authorization: Bearer $PANEL_IMPORT_TOKEN" \
            -H "Content-Type: application/json" -d '{}' -o out/publish-export.json || echo "publish-export unavailable, continuing without published entries"

      # --- 2. episode tracker (gated) ---------------------------------
      - name: Track YouTube episodes
        id: episode
        if: steps.decide.outputs.run_episode == 'true'
        continue-on-error: true
        env:
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          SUMMARY_PER_RUN: '50'
          EPISODE_LOOKBACK_HOURS: '48'
          EPISODE_REWRITE: ${{ inputs.episode_rewrite }}
        run: python3 scripts/episode-guides.py

      # --- 3. title seeder (gated) ------------------------------------
      - name: Seed TMDB titles
        id: title
        if: steps.decide.outputs.run_title == 'true'
        continue-on-error: true
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 scripts/title-seed.py

      # A successful title-seed snapshot in this same slot suppresses a
      # duplicate request. Other slots fetch only one global trending page.
      - name: Check global trending movies (6h)
        id: worldwide_trending
        if: steps.decide.outputs.run_worldwide == 'true'
        continue-on-error: true
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 scripts/refresh_trending.py

      # --- 3b. published metadata refresh (daily 06 UTC + catch-up) --
      # Re-fetch TMDB metadata for already-published titles (poster,
      # overview, release_date incl. the India theatrical date, trailer,
      # providers). TMDB fields ONLY — editorial fields (reviews,
      # summaries, manual corrections, box-office rows) are never
      # touched (see scripts/refresh-metadata.py). Runs right after
      # the seeder so the OTT rebuild in this same run sees fresh
      # providers.
      - name: Refresh published metadata (daily)
        id: metadata
        if: steps.decide.outputs.run_metadata == 'true'
        continue-on-error: true
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 scripts/refresh-metadata.py

      # --- 4. Gemini batch (always) -----------------------------------
      - name: Gemini batch (draft + structured data)
        id: gemini
        continue-on-error: true
        env:
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          # Batch size 2 (the script's designed pace): with 4/run the
          # 40/day cap was exhausted by ~09:00 UTC and the site went
          # stale for 15h. At 2/run the same 40 articles spread across
          # the whole day. DAILY_CAP itself is unchanged (owner call).
          BATCH_SIZE: '2'
          DAILY_CAP: '40'
          RANK_COUNT: '100'
        run: python3 scripts/gemini_batch.py

      # --- 5. apply batch (always) ------------------------------------
      - name: Apply batch to site files
        id: applyauto
        continue-on-error: true
        run: |
          python3 scripts/apply-auto.py

      # --- 5b. OTT data (hourly, cheap) ---------------------------------
      # Rebuild js/ott-data.js from the just-written catalogue (classify
      # only, no API calls; writes only when changed). title-seed.py
      # also rebuilds it on its gated run; this hourly step covers
      # catalogue changes from any other step (apply-auto, backfill).
      # --- 5b. Refresh OTT providers (daily) ------------------------
      # Backfill TMDB watch-providers into js/published-titles.js so
      # the OTT rebuild below sees fresh providers. The seeder only
      # bakes providers for NEW titles; titles published before the
      # providers feature (2026-10-26) have none, so OTT stays thin
      # without this. Runs 02:00 UTC + 24h overdue catch-up. The
      # script writes only when something changed.
      - name: Refresh OTT providers (daily)
        id: providers
        if: steps.decide.outputs.run_providers == 'true'
        continue-on-error: true
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 scripts/backfill_providers.py --apply --rotate 25

      - name: Check OTT digital dates (12h)
        id: digital
        if: steps.decide.outputs.run_digital == 'true'
        continue-on-error: true
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 scripts/build_ott.py --refresh-digital

      - name: Rebuild OTT data
        id: ott
        continue-on-error: true
        run: python3 scripts/build_ott.py --cached-only

      # Trending Topics is reconciled after the feed below: local-only
      # intersection of fresh Google RSS proof and published articles.

      # --- 5d. Overseas gap-fillers (daily) ---------------------------
      # Fill MISSING per-day overseas figures only (never rewrite a
      # figure that already exists). Two routes, cheapest first:
      # (1) Sacnilk quicknews sweep (backfill_overseas.py): the reader
      # (step 6) catches only the CURRENT day's quicknews page live, so
      # this sweep revisits every COMPLETED day still missing overseas
      # and parses that day's quicknews overseas-standing sentence —
      # plain HTTPS, no API quota; attempt-marked so a figure-less day
      # is re-fetched at most weekly; freshest titles first, page-
      # bounded. (2) Tavily + Gemini AI filler (overseas_ai.py) for
      # days Sacnilk never reported: grounded only — a figure is used
      # only if a search result states it for the matching day number;
      # worldwide / India / totals are rejected; nothing is estimated.
      # EVERY cycle attempts EVERY movie missing overseas (owner
      # order 2026-10-30): homepage-window titles first (last 14
      # days, newest first), then the rest; the 48-search cap is the
      # only limiter and any movie it cuts is stamped deferred and
      # leads the next cycle — nothing is skipped silently. Both
      # routes write staging JSON (overseas-backfill.json /
      # overseas-ai.json) which the engine (step 6) averages into
      # js/daywise-data.js in the same run.
      # Runs at the 08:00 + 18:00 UTC Tavily slots (13:00 + 23:00
      # PKT) + overdue catch-up.
      # No keys -> the AI filler SKIPs exit 0; the sweep needs no keys.
      - name: Overseas AI gap-filler
        id: overseas
        if: steps.decide.outputs.run_overseas == 'true'
        continue-on-error: true
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TAVILY_API_KEY_BACKUP: ${{ secrets.TAVILY_API_KEY_BACKUP }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
        run: |
          python3 scripts/backfill_overseas.py --max-pages 48 || echo "overseas sweep failed/missing, continuing"
          python3 scripts/overseas_ai.py --out out/boxoffice-staging/overseas-ai.json --max-searches 48 || echo "overseas-ai failed/missing, continuing"

      # --- 6. Multi-source box office (hourly) ---------------------------
      # Per-site readers fetch day-wise INDIA NET figures into
      # out/boxoffice-staging/<source>.json; the averaging engine
      # (scripts/multisource_boxoffice.py) means them per movie+day and
      # is the SOLE writer of js/daywise-data.js. Sacnilk runs on
      # its 3h gate (02, 05, 08, 11, 14, 17, 20, 23 UTC) with --apply (keeps the
      # advance-data.js write) plus --stage (its staging file); the
      # staging files are committed so they persist across runs (a fresh
      # checkout has no staging otherwise). A reader that is missing or
      # fails is skipped — the engine averages whatever is present.
      # The step never commits by itself; step 14's single commit picks
      # up daywise-data.js / staging / sidecar only if changed.
      # Tavily (2x/day) searches current India Net candidates. Its raw URL,
      # result title, quote and snippet go to RUNNER_TEMP; Gemini receives
      # those results plus same-day direct-reader values and can only accept
      # a verbatim cited quote. The Python engine then computes the final
      # mean; Gemini is not an extra numerical vote. Same-reader-domain
      # Tavily results are excluded to avoid double-counting.
      - name: Multi-source box office
        id: multisource
        continue-on-error: true
        env:
          RUN_SACNILK: ${{ steps.decide.outputs.run_sacnilk }}
          RUN_TAVILY: ${{ steps.decide.outputs.run_tavily }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TAVILY_API_KEY_BACKUP: ${{ secrets.TAVILY_API_KEY_BACKUP }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
        run: |
          mkdir -p out/boxoffice-staging
          if [ "$RUN_SACNILK" = "true" ]; then
            python3 scripts/run_source.py sacnilk_boxoffice -- python3 scripts/sacnilk_boxoffice.py --apply --stage '{stage}'  || echo "sacnilk stage failed, continuing with existing staging"
          else
            echo "sacnilk source gate off (3h slots)"
          fi
          python3 scripts/run_source.py fnn_boxoffice -- python3 scripts/fnn_boxoffice.py --stage '{stage}' --out '{out}' || echo "filmynewsnetwork reader failed/missing, continuing"
          python3 scripts/run_source.py --reviews-out out/bmr-reviews.json wp_boxoffice -- python3 scripts/wp_boxoffice.py --stage '{stage}' --out '{out}' --reviews-out '{reviews}' || echo "wordpress reader failed/missing, continuing"
          python3 scripts/run_source.py bollybourse_boxoffice -- python3 scripts/bollybourse_boxoffice.py --stage '{stage}' --out '{out}' || echo "bollybourse reader failed/missing, continuing"
          python3 scripts/run_source.py moviemint_boxoffice -- python3 scripts/moviemint_boxoffice.py --stage '{stage}' --out '{out}' || echo "moviemint reader failed/missing, continuing"
          python3 scripts/run_source.py filmibeat_boxoffice -- python3 scripts/filmibeat_boxoffice.py --stage '{stage}' --out '{out}' || echo "filmibeat reader failed/missing, continuing"
          # Optional Varanasi reader is not configured in this checkout.
          if [ "$RUN_TAVILY" = "true" ]; then
            EVIDENCE="$RUNNER_TEMP/flickatlas-tavily-evidence.json"
            rm -f "$EVIDENCE"
            python3 scripts/tavily_boxoffice.py --stage out/boxoffice-staging --evidence-out "$EVIDENCE" || echo "tavily search failed; retaining last-good Tavily staging"
            python3 scripts/gemini_boxoffice.py --evidence "$EVIDENCE" --staging out/boxoffice-staging --out out/boxoffice-staging/tavily.json || echo "Gemini review failed; retaining last-good Tavily staging"
          else
            echo "tavily/Gemini verification gated off this hour (existing runs: 08:35/18:35 UTC = 13:35/23:35 PKT)"
          fi
          python3 scripts/multisource_boxoffice.py --staging out/boxoffice-staging
          # Worldwide totals (2026-10-28): merges *-worldwide.json staging
          # (Tavily pass 2) + scripts/worldwide-seed.json into
          # js/worldwide-data.js. Never touches day-wise.
          python3 scripts/worldwide_boxoffice.py --staging out/boxoffice-staging || echo "worldwide totals failed/missing, continuing"

      # --- 6b. Movie reviews (Gemini, gated) ---------------------------
      # Fills js/reviews-data.js for released movies that have no review
      # yet. Udta Teer (Movies Flare seed) is never overwritten. The
      # generator searches Tavily per movie for review coverage, grounds
      # the review in the search results + TMDB overview/cast/genres and
      # the BMR critic average (out/bmr-reviews.json, written by the WP
      # reader in step 6), and skips movies with no coverage yet (retried
      # the next day — reviews typically appear 2-3 days after release).
      # Runs 19:00 UTC (after the 18:00 title seeder) + 24h overdue
      # catch-up. No Gemini keys -> SKIP exit 0.
      - name: Movie reviews (Gemini)
        id: reviews
        if: steps.decide.outputs.run_reviews == 'true'
        continue-on-error: true
        env:
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TAVILY_API_KEY_BACKUP: ${{ secrets.TAVILY_API_KEY_BACKUP }}
        run: |
          python3 scripts/gemini_reviews.py --published js/published-titles.js --reviews-out js/reviews-data.js --bmr out/bmr-reviews.json || echo "reviews generation failed, continuing with existing reviews-data.js"

      # --- 7. publish panel-approved articles (always) -----------------
      - name: Publish approved articles
        id: publish
        continue-on-error: true
        env:
          PANEL_IMPORT_TOKEN: ${{ secrets.PANEL_IMPORT_TOKEN }}
        run: |
          curl -sS -X POST "https://flickatlas-admin.hidden-decodes.workers.dev/api/assistant/publish-export" \
            -H "Authorization: Bearer $PANEL_IMPORT_TOKEN" \
            -H "Content-Type: application/json" -d '{}' -o /tmp/export.json
          python3 scripts/apply-publish.py /tmp/export.json js/articles-data.js
          curl -sS -X POST "https://flickatlas-admin.hidden-decodes.workers.dev/api/assistant/publish-export" \
            -H "Authorization: Bearer $PANEL_IMPORT_TOKEN" \
            -H "Content-Type: application/json" -d '{}' -o out/publish-export.json || echo "publish-export unavailable, continuing without published entries"

      # --- 7b. Refresh article keywords (daily, Gemini) --------------
      # One batched Gemini call refreshes keywords for up to 15 news
      # articles (oldest-keywords-first; articles missing keywords go
      # first; refreshed < 7 days ago are skipped). Only the `keywords`
      # field is touched — headline/body/facts are never rewritten.
      # Runs 03:00 UTC + 24h overdue catch-up. No keys -> SKIP exit 0.
      # The refresh uses ONE Gemini call/day and does NOT draw from
      # DAILY_CAP (it publishes no articles). See
      # scripts/refresh-keywords.py.
      - name: Refresh article keywords (daily)
        id: keywords
        if: steps.decide.outputs.run_keywords == 'true'
        continue-on-error: true
        env:
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
        run: python3 scripts/refresh-keywords.py

      # --- 8. rebuild news feed (always, AFTER all article writers) ---
      - name: Rebuild news feed
        id: feed
        continue-on-error: true
        env:
          # Free current Google RSS hourly; paid Tavily fallback daily only.
          # Paid search coverage is NEVER accepted as Trending Topics proof.
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TAVILY_API_KEY_BACKUP: ${{ secrets.TAVILY_API_KEY_BACKUP }}
        run: python3 scripts/convert-news.py

      - name: Reconcile published Trending Topics (local only)
        id: trending
        continue-on-error: true
        run: python3 scripts/trending_weekly.py --reconcile-only

      # --- 9. GA4 traffic stats (always) -------------------------------
      - name: GA4 traffic stats
        id: traffic
        continue-on-error: true
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
        run: |
          pip install google-analytics-data
          python3 scripts/stats-traffic.py

      # --- 10. pipeline stats (gated, every 6h) -------------------------
      # NOTE: scripts/stats-pipeline.py MUST be updated first — it
      # queries the Actions API for news-refresh.yml / auto-pipeline.yml
      # / publish.yml by filename (see DESIGN.md §7). Point it at
      # hourly-pipeline.yml (or out/orchestrator-state.json) before cutover.
      - name: Pipeline stats
        id: statspipe
        if: steps.decide.outputs.run_stats_pipeline == 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/stats-pipeline.py

      # --- 11. site health (gated, daily 06:00 UTC) --------------------
      - name: Site health
        id: health
        if: steps.decide.outputs.run_stats_health == 'true'
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DMCA_STATUS_JSON: ${{ secrets.DMCA_STATUS_JSON }}
          SEARCH_CONSOLE_STATUS_JSON: ${{ secrets.SEARCH_CONSOLE_STATUS_JSON }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
        run: |
          pip install google-auth requests
          python3 scripts/stats-health.py

      # --- 12. ONE ?v= bump (was up to 4 separate rewrites/hour) -------
      - name: Bump asset version when content changed
        id: bump
        continue-on-error: true
        run: |
          if git diff --quiet -- js/articles-data.js js/published-titles.js js/daywise-data.js js/advance-data.js js/worldwide-data.js js/ott-data.js js/trending-data.js js/trending-topics.js js/reviews-data.js; then
            echo "public data assets unchanged, keeping ?v="
          else
            NEWV="fa-$(date -u +%Y%m%d%H%M)"
            echo "bumping ?v= to $NEWV"
            find . -name '*.html' -not -path './.git/*' -exec sed -i -E "s/\?v=[A-Za-z0-9_-]+/?v=$NEWV/g" {} +
          fi

      # --- 13. record per-step health + last-run times ------------------
      - name: Write orchestrator state
        if: always()
        env:
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
          EPISODE_OUTCOME: ${{ steps.episode.outcome }}
          TITLE_OUTCOME: ${{ steps.title.outcome }}
          GEMINI_OUTCOME: ${{ steps.gemini.outcome }}
          APPLY_OUTCOME: ${{ steps.applyauto.outcome }}
          SACNILK_OUTCOME: ${{ steps.multisource.outcome }}
          TAVILY_OUTCOME: ${{ steps.multisource.outcome }}
          REVIEWS_OUTCOME: ${{ steps.reviews.outcome }}
          TRENDING_OUTCOME: ${{ steps.trending.outcome }}
          OVERSEAS_OUTCOME: ${{ steps.overseas.outcome }}
          MULTISOURCE_OUTCOME: ${{ steps.multisource.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          FEED_OUTCOME: ${{ steps.feed.outcome }}
          TRAFFIC_OUTCOME: ${{ steps.traffic.outcome }}
          BUMP_OUTCOME: ${{ steps.bump.outcome }}
          STATS_PIPE_OUTCOME: ${{ steps.statspipe.outcome }}
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
          RUN_EPISODE: ${{ steps.decide.outputs.run_episode }}
          RUN_TITLE: ${{ steps.decide.outputs.run_title }}
          RUN_SACNILK: ${{ steps.decide.outputs.run_sacnilk }}
          RUN_TAVILY: ${{ steps.decide.outputs.run_tavily }}
          RUN_REVIEWS: ${{ steps.decide.outputs.run_reviews }}
          # RUN_TRENDING was missing here until 2026-10-27 (fix 3):
          # the state step read RUN_TRENDING but it was never passed,
          # so trending_weekly NEVER got a last_run even when it ran.
          RUN_TRENDING: ${{ steps.decide.outputs.run_trending }}
          RUN_METADATA: ${{ steps.decide.outputs.run_metadata }}
          METADATA_OUTCOME: ${{ steps.metadata.outcome }}
          RUN_PROVIDERS: ${{ steps.decide.outputs.run_providers }}
          PROVIDERS_OUTCOME: ${{ steps.providers.outcome }}
          RUN_KEYWORDS: ${{ steps.decide.outputs.run_keywords }}
          KEYWORDS_OUTCOME: ${{ steps.keywords.outcome }}
          RUN_STATS_PIPE: ${{ steps.decide.outputs.run_stats_pipeline }}
          RUN_HEALTH: ${{ steps.decide.outputs.run_stats_health }}
          RUN_OVERSEAS: ${{ steps.decide.outputs.run_overseas }}
        run: python3 scripts/pipeline_schedule.py record

      # --- 13b. per-step run records (stats dashboard data) -----------
      # Every pipeline step that ran writes its own record into
      # out/step-runs.json (see scripts/step_runs.py). This step fills
      # in the steps that did NOT record (gate off, failed before
      # their record call, or not yet instrumented) so the panel's
      # stats dashboard always has a row per step per run. It reads
      # the step outcomes + decide flags from env (same pattern as
      # step 13) and matches records by run id — steps that already
      # recorded this run are left alone.
      - name: Record step runs
        if: always()
        env:
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
          EPISODE_OUTCOME: ${{ steps.episode.outcome }}
          TITLE_OUTCOME: ${{ steps.title.outcome }}
          GEMINI_OUTCOME: ${{ steps.gemini.outcome }}
          APPLY_OUTCOME: ${{ steps.applyauto.outcome }}
          OTT_OUTCOME: ${{ steps.ott.outcome }}
          TRENDING_OUTCOME: ${{ steps.trending.outcome }}
          OVERSEAS_OUTCOME: ${{ steps.overseas.outcome }}
          MULTISOURCE_OUTCOME: ${{ steps.multisource.outcome }}
          TAVILY_OUTCOME: ${{ steps.multisource.outcome }}
          REVIEWS_OUTCOME: ${{ steps.reviews.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          FEED_OUTCOME: ${{ steps.feed.outcome }}
          TRAFFIC_OUTCOME: ${{ steps.traffic.outcome }}
          STATS_PIPE_OUTCOME: ${{ steps.statspipe.outcome }}
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
          METADATA_OUTCOME: ${{ steps.metadata.outcome }}
          RUN_EPISODE: ${{ steps.decide.outputs.run_episode }}
          RUN_TITLE: ${{ steps.decide.outputs.run_title }}
          RUN_REVIEWS: ${{ steps.decide.outputs.run_reviews }}
          RUN_TRENDING: ${{ steps.decide.outputs.run_trending }}
          RUN_STATS_PIPE: ${{ steps.decide.outputs.run_stats_pipeline }}
          RUN_HEALTH: ${{ steps.decide.outputs.run_stats_health }}
          RUN_OVERSEAS: ${{ steps.decide.outputs.run_overseas }}
          RUN_TAVILY: ${{ steps.decide.outputs.run_tavily }}
          RUN_METADATA: ${{ steps.decide.outputs.run_metadata }}
          RUN_PROVIDERS: ${{ steps.decide.outputs.run_providers }}
          PROVIDERS_OUTCOME: ${{ steps.providers.outcome }}
          RUN_KEYWORDS: ${{ steps.decide.outputs.run_keywords }}
          KEYWORDS_OUTCOME: ${{ steps.keywords.outcome }}
        run: python3 scripts/step_runs.py --aggregate

      # --- 13c. Record daily history (always, never fatal) --------------
      # Appends today's totals (fetch/AI/publish counts, per-category
      # split, hourly buckets) to out/daily-history.json so the panel can
      # render the 14-day chart, heatmap, deltas, sparklines and hourly
      # usage chart from REAL data. Guards inside the script stop any
      # double counting (report hash, gemini generated timestamp, max()
      # for publish/posts). continue-on-error + the script's own
      # always-exit-0 mean this step can never fail the run.
      - name: Record daily history
        id: dailyhistory
        if: always()
        continue-on-error: true
        env:
          PANEL_IMPORT_TOKEN: ${{ secrets.PANEL_IMPORT_TOKEN }}
        run: python3 scripts/daily_history.py

      # --- 13d. SEO assets (always, never fatal) ----------------------
      # Regenerate js/seo-meta.json + sitemap.xml + robots.txt from the
      # live data (scripts/seo_assets.py, stdlib only, deterministic —
      # no timestamps, so the files only change when the DATA changes).
      # The Worker injects per-URL <title>/meta/OG/JSON-LD for the
      # client-rendered detail shells (/movie, /show, /news-item,
      # /box-office-day, /category) from js/seo-meta.json; the sitemap
      # lists every listing + detail + article URL for Google.
      # continue-on-error: a generator failure must never fail the run
      # (the previous hour's files stay live and keep working).
      - name: SEO assets
        id: seoassets
        if: always()
        continue-on-error: true
        run: python3 scripts/seo_assets.py

      # --- 14. ONE commit (always runs, even if a step failed) ---------
      # A manual push can land while the pipeline runs (the parent pushes
      # by hand all day). The pipeline's HTML changes are ONLY the
      # mechanical ?v= bump, so a rebase conflict in an HTML file is
      # resolved by taking origin/main's version and re-applying the bump
      # (keeps the manual change AND the new ?v=). A conflict in a DATA
      # file (js/*.js, api-*.json, out/*) is NOT auto-resolved — the run
      # aborts the commit and the next hourly run retries from the fresh
      # main, so no generated data is ever silently overwritten or lost.
      # (2026-10-26: the 15:55 UTC run failed exactly this way — the
      # parent's 1191dd63 landed mid-run and both sides touched
      # movie/index.html; the rebase conflict killed the whole run and
      # its 53-file commit, including that hour's new articles.)
      - name: Commit if changed
        id: commit
        if: always()
        env:
          # Keys the commit-retry script's regenerators need when a
          # data file conflicts during the rebase (title-seed needs
          # TMDB; reviews/trending need Gemini + Tavily). The other
          # regenerators need no keys.
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TAVILY_API_KEY_BACKUP: ${{ secrets.TAVILY_API_KEY_BACKUP }}
        run: bash scripts/commit_with_retry.sh

      # --- 15. Deploy to Cloudflare (always) ------------------------------
      # Static-asset deploy via the Cloudflare API (see
      # scripts/cloudflare_deploy.py). UNCONDITIONAL since 12fb0d96: the
      # old gate ("only when the run committed") meant a manual push with
      # no pipeline changes sat undeployed until the next content-changing
      # run. The script exits 0 with a warning when CLOUDFLARE_API_TOKEN
      # is not set yet, so the pipeline keeps working until the secret is
      # added.
      - name: Deploy to Cloudflare
        id: cfdeploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/cloudflare_deploy.py

      # --- 16. Dispatch the AI watchdog (its own workflow) ------------------
      # The watchdog is NO LONGER a pipeline step (owner rule 2026-10-28:
      # "watchdog bhi GitHub/Gemini ki tarah so na jaye"). It runs as its
      # own workflow (.github/workflows/watchdog.yml): this step dispatches
      # it AFTER the deploy, so the check always sees the deployed site
      # and the verdict covers this run's hour (derived from the run id).
      # The watchdog workflow also has its own :25 UTC schedule as a
      # backup — if this dispatch never happens (pipeline missed/failed),
      # the backup run still checks the hour and re-dispatches the
      # pipeline once. if: always() — a failed pipeline still gets
      # judged. Best-effort: a failed dispatch never fails the run.
      - name: Dispatch AI watchdog
        id: dispatch-watchdog
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/watchdog.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"pipeline_run_id\":\"${{ github.run_id }}\"}}")
          echo "watchdog dispatch HTTP $code"
          [ "$code" = "204" ] || echo "watchdog dispatch failed (non-fatal)"






















