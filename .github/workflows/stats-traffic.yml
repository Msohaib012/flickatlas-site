# FlickAtlas stats — traffic half (Google Analytics 4).
# Every 15 minutes it pulls GA4 (Data API + Realtime API) and writes
# js/stats-traffic.json: users active now, today / last-7-day totals,
# top pages, sources, countries, devices, and per-post views + top source.
# With no GA4 credentials the script writes {"connected": false} and the
# workflow still succeeds — the stats page shows "not connected" instead
# of fake numbers. Needs repo secrets GA4_PROPERTY_ID and
# GA4_SERVICE_ACCOUNT_JSON (see ga4-setup.md for the owner steps).
name: Stats — traffic (GA4)

on:
  # schedule: DISABLED 2026-10-26 (consolidation) — steps moved into
  # hourly-pipeline.yml. (Was hourly: GA4 traffic stats do not need
  # 15-min freshness.) Keep workflow_dispatch for manual runs;
  # rollback = uncomment the cron below.
  #   - cron: '20 * * * *'
  workflow_dispatch:

concurrency:
  group: flickatlas-site-writes
  cancel-in-progress: false

jobs:
  stats-traffic:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GA4 client
        run: pip install google-analytics-data
      - name: Pull GA4 and build traffic stats JSON
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/stats-traffic.py
      - name: Commit if changed
        # Commit-with-retry (stall fix 2026-10-28): on conflict the traffic
        # JSON rebuilds via stats-traffic.py (same env as the pull step).
        env:
          RETRY_ADD: "js/stats-traffic.json"
          RETRY_REGEN: "python3 scripts/stats-traffic.py"
          RETRY_MESSAGE: "stats: traffic"
          RETRY_HTML_BUMP: "0"
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
        run: bash scripts/commit_with_retry_standalone.sh
