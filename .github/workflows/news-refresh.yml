name: News feed refresh
on:
  schedule:
    - cron: '35 * * * *'
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch feeds and build news JSON
        run: |
          python3 scripts/fetch.py --registry scripts/registry.json --out out
          python3 scripts/convert-news.py
      - name: Commit if changed
        run: |
          git config user.name "flickatlas-news"
          git config user.email "news@flickatlas.local"
          git add out api-news.json api-trends.json
          git diff --cached --quiet || git commit -m "news: refresh feed $(date -u +%Y-%m-%dT%H:%M:%SZ)" && git push
