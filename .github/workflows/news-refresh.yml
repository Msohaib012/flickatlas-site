name: News feed refresh
on:
  # schedule: DISABLED 2026-10-26 (consolidation) — steps moved into
  # hourly-pipeline.yml. Keep workflow_dispatch for manual runs;
  # rollback = uncomment the cron below.
  #   - cron: '35 * * * *'
  workflow_dispatch:
concurrency:
  group: flickatlas-site-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch feeds and build news JSON
        env:
          PANEL_IMPORT_TOKEN: ${{ secrets.PANEL_IMPORT_TOKEN }}
        run: |
          python3 scripts/fetch.py --registry scripts/registry.json --out out
          # Published articles' feed entries: the news-item page looks a story
          # up in /api/news before it checks the articles file, so approved
          # articles whose source story aged out of today's fetch must be
          # merged into the feed or they show "moved on". Non-fatal if the
          # panel call fails — the feed still builds from today's queue.
          curl -sS -X POST "https://flickatlas-admin.hidden-decodes.workers.dev/api/assistant/publish-export" \
            -H "Authorization: Bearer $PANEL_IMPORT_TOKEN" \
            -H "Content-Type: application/json" -d '{}' -o out/publish-export.json || echo "publish-export unavailable, continuing without published entries"
          python3 scripts/convert-news.py
      - name: Commit if changed
        # Commit-with-retry (stall fix 2026-10-28): on conflict the feed
        # rebuilds via convert-news.py from this run's out/queue.json.
        env:
          RETRY_ADD: "out api-news.json api-trends.json"
          RETRY_REGEN: "python3 scripts/convert-news.py"
          RETRY_MESSAGE: "news: refresh feed"
          RETRY_HTML_BUMP: "0"
        run: bash scripts/commit_with_retry_standalone.sh
