# FlickAtlas stats — pipeline half.
# Hourly (5 min past the hour, just after the :50 Gemini run) it rebuilds
# js/stats-pipeline.json from the pipeline's own files + the Actions API:
# last fetch run (sources, per-category stories, queue), last Gemini run
# (picks, posts made), last publish run, post totals, and the next run
# time for each of the three. No new service, no extra secrets — the
# default GITHUB_TOKEN reads the Actions API. Commits only when changed.
name: Stats — pipeline

on:
  # schedule: DISABLED 2026-10-26 (consolidation) — steps moved into
  # hourly-pipeline.yml. (Was every 6h: pipeline stats do not need
  # hourly freshness.) Keep workflow_dispatch for manual runs;
  # rollback = uncomment the cron below.
  #   - cron: '5 */6 * * *'
  workflow_dispatch:

concurrency:
  group: flickatlas-site-writes
  cancel-in-progress: false

jobs:
  stats-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build pipeline stats JSON
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/stats-pipeline.py
      - name: Commit if changed
        # Commit-with-retry (stall fix 2026-10-28): on conflict the stats
        # JSON rebuilds via stats-pipeline.py.
        env:
          RETRY_ADD: "js/stats-pipeline.json"
          RETRY_REGEN: "python3 scripts/stats-pipeline.py"
          RETRY_MESSAGE: "stats: pipeline"
          RETRY_HTML_BUMP: "0"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/commit_with_retry_standalone.sh
